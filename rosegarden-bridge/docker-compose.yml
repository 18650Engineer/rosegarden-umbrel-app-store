services:
  app_proxy:
    environment:
      APP_HOST: rosegarden-bridge_web_1
      APP_PORT: 8765
      # Do not disable the Umbrel login protection.

  web:
    image: ghcr.io/18650engineer/rosegarden-bridge:0.2.0
    restart: on-failure
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "1000:1000"
    environment:
      ROSE_HOST: "0.0.0.0"
      ROSE_TRUST_PROXY: "1"
      ROSE_PORT: "8765"
      ROSE_BRIDGE_BACKEND: "rest"
      ROSE_BRIDGE_REST_URL: "https://10.21.21.66:8180"
      ROSE_BRIDGE_TLS_CERT: "/run/bridge/tls.cert"
      ROSE_BRIDGE_MACAROON: "/run/bridge/participant.macaroon"
      ROSE_MAX_BTC_SAT: "10000"
      ROSE_MAX_BLAKE_SAT: "5000000"
      # Start9 automated payments disabled until explicitly configured
    volumes:
      - ${APP_DATA_DIR}/data/bridge:/run/bridge:ro
