id: rosegarden-bridge
category: bitcoin
name: Rose Garden Bridge
tagline: Private Lightning swaps between SHA256BTC and BLAKE2BTC
version: "0.1.2-alpha"
port: 8765
description: >-
  Private bridge companion UI for the Paulscode Lightning Fork. Request SHA256BTC
  to BLAKE2BTC or reverse quotes, review price and expiry, and copy a hold
  invoice into a separate Lightning wallet. Existing bridge service and
  restricted participant credentials required. This application does not
  run a bridge or pay automatically unless separately configured.
