releaseNotes: >-
  Fix BOLT11 invoice validation so SHA256BTC and BLAKE2BTC Lightning invoices
  containing the mandatory Bech32 separator are accepted, including uppercase
  invoices. Payment approval and bridge safety settings are unchanged.
